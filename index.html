<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senior Visit Form</title>
</head>

<body style="font-family:Arial,sans-serif;background:#f5f5f5;padding:15px;">

<div style="max-width:850px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 0 8px #ccc;">

<h2 style="text-align:center;margin-top:0;">
Senior Caregiver Visit Form
</h2>

<form id="visitForm">

<label>Beneficiary Name</label>
<input
type="text"
name="beneficiary"
required
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Bathroom Assistance</label>
<input
type="text"
name="bathroom"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Mobility / Transfer</label>
<input
type="text"
name="mobility"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Meals Served</label>
<input
type="text"
name="meals"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Laundry</label>
<input
type="text"
name="laundry"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>House Keeping</label>
<input
type="text"
name="housekeeping"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Medication</label>
<input
type="text"
name="medication"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Observation</label>
<textarea
name="observation"
style="width:100%;height:90px;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;"></textarea>

<label>Visit Date</label>
<input
type="date"
name="visitDate"
required
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Caregiver Name</label>
<input
type="text"
name="caregiver"
required
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Supervisor</label>
<input
type="text"
name="supervisor"
style="width:100%;padding:10px;margin:6px 0 15px;border:1px solid #ccc;border-radius:4px;">

<label>Beneficiary Photo</label>

<input
type="file"
id="photo"
name="photo"
accept="image/*"
capture="environment"
style="width:100%;margin:8px 0 15px;">

<img
id="preview"
style="display:none;width:220px;border:1px solid #ccc;border-radius:5px;margin-bottom:15px;">

<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">
<input type="hidden" name="timestamp" id="timestamp">

<button
type="submit"
style="background:#0b6efd;color:white;border:none;padding:12px 25px;border-radius:5px;font-size:16px;cursor:pointer;width:100%;">

Submit Visit

</button>

</form>

<p id="status" style="text-align:center;font-weight:bold;margin-top:20px;"></p>

</div>

<script>

const SCRIPT_URL="YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

document.getElementById("timestamp").value=new Date().toISOString();

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(position){

document.getElementById("latitude").value=position.coords.latitude;

document.getElementById("longitude").value=position.coords.longitude;

});

}

const photo=document.getElementById("photo");

const preview=document.getElementById("preview");

photo.onchange=function(){

if(this.files.length>0){

preview.src=URL.createObjectURL(this.files[0]);

preview.style.display="block";

}

};

document.getElementById("visitForm").addEventListener("submit",function(e){

e.preventDefault();

const status=document.getElementById("status");

status.style.color="blue";

status.innerHTML="Submitting...";

const formData=new FormData(this);

fetch(SCRIPT_URL,{

method:"POST",

body:formData

})

.then(response=>response.text())

.then(data=>{

status.style.color="green";

status.innerHTML="Visit submitted successfully.";

document.getElementById("visitForm").reset();

preview.style.display="none";

document.getElementById("timestamp").value=new Date().toISOString();

})

.catch(error=>{

status.style.color="red";

status.innerHTML="Submission failed.";

console.log(error);

});

});

</script>

</body>
</html>
