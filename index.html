<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0B6E4F">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="Senior Visits"
>

<link
  rel="icon"
  href="images/icons/icon-192x192.png"
>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Senior Visit Form</title>

</head>


<body
style="
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
">


<div
style="
max-width:850px;
margin:auto;
background:#fff;
padding:20px;
border-radius:8px;
box-shadow:0 0 8px #ccc;
"
>


<h2 style="text-align:center;margin-top:0;">
Senior Caregiver Visit Form
</h2>


<form id="visitForm">


<label for="beneficiary">
Beneficiary Name
</label>

<input
type="text"
id="beneficiary"
name="beneficiary"
required
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="bathroom">
Bathroom Assistance
</label>

<input
type="text"
id="bathroom"
name="bathroom"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="mobility">
Mobility / Transfer
</label>

<input
type="text"
id="mobility"
name="mobility"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="meals">
Meals Served
</label>

<input
type="text"
id="meals"
name="meals"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="laundry">
Laundry
</label>

<input
type="text"
id="laundry"
name="laundry"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="housekeeping">
House Keeping
</label>

<input
type="text"
id="housekeeping"
name="housekeeping"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="medication">
Medication
</label>

<input
type="text"
id="medication"
name="medication"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="observation">
Observation
</label>

<textarea
id="observation"
name="observation"
style="
width:100%;
height:90px;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
></textarea>


<label for="visitDate">
Visit Date
</label>

<input
type="date"
id="visitDate"
name="visitDate"
required
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="caregiver">
Caregiver Name
</label>

<input
type="text"
id="caregiver"
name="caregiver"
required
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="supervisor">
Supervisor
</label>

<input
type="text"
id="supervisor"
name="supervisor"
style="
width:100%;
padding:10px;
margin:6px 0 15px;
border:1px solid #ccc;
border-radius:4px;
"
>


<label for="photo">
Beneficiary Photo
</label>

<input
type="file"
id="photo"
name="photo"
accept="image/*"
capture="environment"
style="
width:100%;
margin:8px 0 15px;
"
>


<img
id="preview"
alt="Photo preview"
style="
display:none;
width:220px;
border:1px solid #ccc;
border-radius:5px;
margin-bottom:15px;
"
>


<input
type="hidden"
name="latitude"
id="latitude"
>

<input
type="hidden"
name="longitude"
id="longitude"
>

<input
type="hidden"
name="timestamp"
id="timestamp"
>


<button
type="submit"
id="submitButton"
style="
background:#0b6efd;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
font-size:16px;
cursor:pointer;
width:100%;
"
>

Submit Visit

</button>


</form>


<p
id="status"
role="alert"
aria-live="polite"
style="
text-align:center;
font-weight:bold;
margin-top:20px;
"
></p>


</div>


<!--
====================================================
MAIN APPLICATION JAVASCRIPT
====================================================
-->

<script src="js/app.js"></script>


<!--
====================================================
SERVICE WORKER
====================================================
-->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker
            .register("service-worker.js")

            .then(function (registration) {

                console.log(
                    "Service Worker registered successfully:",
                    registration.scope
                );

            })

            .catch(function (error) {

                console.error(
                    "Service Worker registration failed:",
                    error
                );

            });

    });

}

</script>


</body>

</html>
